# Conda environment for the reproducibility repository.
#   conda env create -f environment.yml
#   conda activate ctm-repro
#   pip install -e .
#
# Versions are pinned exactly; see requirements-lock.txt for the pip equivalent
# and install_r_deps.R for the R stack.
name: ctm-repro

channels:
  - conda-forge

dependencies:
  # Pinned to the exact versions used to produce the committed figures. A numerical
  # result can move under a patch bump (a changed default, solver, or tie-breaking
  # rule), so these are pinned rather than ranged.
  - python=3.13
  - numpy=2.1.3
  - pandas=2.3.3
  - scipy=1.15.3
  - matplotlib=3.10.0
  - statsmodels=0.14.4
  - pyyaml=6.0.2
  - pip
  - pytest=8.3.4
  - ruff
  - black
